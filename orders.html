<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂單查詢</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/orders.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">O</div>
        <span>我的商店</span>
      </a>
      <nav class="header-nav">
        <a href="index.html">首頁</a>
        <a href="orders.html" class="active">訂單查詢</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- Hero Search -->
    <section class="hero">
      <div class="hero-inner">
        <p class="hero-eyebrow">訂單查詢</p>
        <h1 class="hero-title">查詢您的訂單狀態</h1>
        <p class="hero-sub">輸入訂單編號，即時掌握最新進度</p>
        <form class="search-form" id="searchForm" autocomplete="off">
          <div class="search-field">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
            <input
              type="text"
              id="orderInput"
              placeholder="例如：S00001"
              maxlength="20"
              aria-label="訂單編號"
            />
          </div>
          <button type="submit" class="search-btn">查詢</button>
        </form>
        <p class="search-hint" id="searchError"></p>
      </div>
    </section>

    <!-- Result Area -->
    <section class="result-section" id="resultSection" aria-live="polite">
      <!-- Filled by JS -->
    </section>

  </main>

  <footer class="site-footer">
    <p>© 2024 我的商店．如有疑問請聯繫客服</p>
  </footer>

  <script src="js/orders.js"></script>
</body>
</html>
